
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CampusFind</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 25px; }

        .back-button {
            background: white;
            color: #172554;
            padding: 10px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .notification {
            background: white;
            padding: 22px;
            margin-bottom: 16px;
            border-radius: 12px;
            border-left: 5px solid #64748b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .notification h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .notification p {
            color: #555;
            line-height: 1.6;
        }

        .notification small {
            display: block;
            margin-top: 12px;
            color: #888;
        }

        .pending { border-left-color: #eab308; }
        .approved { border-left-color: #16a34a; }
        .rejected { border-left-color: #dc2626; }
        .returned { border-left-color: #2563eb; }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-returned {
            background: #dbeafe;
            color: #1e40af;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 50px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .empty h2 { margin-bottom: 12px; }

        .empty p {
            color: #666;
            line-height: 1.6;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
                gap: 12px;
            }

            header h1 { font-size: 20px; }

            .container { margin-top: 25px; }

            .page-title { font-size: 25px; }
        }
    </style>
</head>

<body>

<header>
    <h1>🔔 CampusFind</h1>
    <a href="dashboard.html" class="back-button">← Dashboard</a>
</header>

<main class="container">

    <h2 class="page-title">Your Notifications</h2>

    <p class="subtitle">
        Check the latest updates about your lost-item claims.
    </p>

    <div id="errorMessage" class="error"></div>
    <div id="notificationList"></div>

</main>

<footer>
    CampusFind — College Lost and Found Management System
</footer>

<script>
    const API_URL = "https://great-suns-kiss.loca.lt/api";

    // Get the currently logged-in student.
    let student;

    try {
        student = JSON.parse(
            sessionStorage.getItem("campusFindStudent")
        );
    } catch (error) {
        student = null;
    }

    // Prevent access without login.
    if (!student || !student.student_id) {
        window.location.href = "student.html";
    }

    const STUDENT_ID = Number(student.student_id);

    const notificationList =
        document.getElementById("notificationList");

    const errorMessage =
        document.getElementById("errorMessage");


    function escapeHTML(value) {
        return String(value || "").replace(/[&<>"']/g, function(character) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[character];
        });
    }


    function formatDate(dateString) {
        if (!dateString) {
            return "Date unavailable";
        }

        const date = new Date(
            dateString.replace(" ", "T")
        );

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleString("en-IN");
    }


    function createNotification(claim) {
        let title = "";
        let message = "";
        let statusClass = "";
        let statusLabel = "";

        const itemName = claim.item_title || "Unknown Item";

        const claimStatus = String(
            claim.claim_status || ""
        ).toUpperCase();

        switch (claimStatus) {

            case "PENDING":
                title = "⏳ Claim Under Review";

                message =
                    `Your claim for "${itemName}" has been submitted. ` +
                    "Please wait for the college staff to review it.";

                statusClass = "pending";
                statusLabel = "PENDING";
                break;


            case "APPROVED":
                title = "✅ Claim Approved";

                message =
                    `Your claim for "${itemName}" has been approved. ` +
                    "Contact the college staff to verify your identity " +
                    "and arrange collection of the item.";

                statusClass = "approved";
                statusLabel = "APPROVED";
                break;


            case "REJECTED":
                title = "❌ Claim Rejected";

                message =
                    `Your claim for "${itemName}" was rejected. ` +
                    "Please contact the college staff for further information.";

                statusClass = "rejected";
                statusLabel = "REJECTED";
                break;


            case "RETURNED":
                title = "📦 Item Handover Completed";

                message =
                    `Your claim for "${itemName}" is marked as returned. ` +
                    "The staff dashboard records the handover as completed.";

                statusClass = "returned";
                statusLabel = "RETURNED";
                break;


            default:
                title = "📌 Claim Update";
                message =
                    `Your claim for "${itemName}" has an update.`;

                statusClass = "pending";
                statusLabel = claimStatus || "UNKNOWN";
        }

        const formattedDate = formatDate(claim.claim_date);

        return `
            <article class="notification ${statusClass}">

                <h3>${escapeHTML(title)}</h3>

                <p>${escapeHTML(message)}</p>

                <span class="status status-${statusClass}">
                    ${escapeHTML(statusLabel)}
                </span>

                <small>
                    Claim reference: CF-${escapeHTML(claim.claim_id)}
                </small>

                <small>
                    Submitted on: ${escapeHTML(formattedDate)}
                </small>

            </article>
        `;
    }


    // Retrieve notifications from MySQL through Java.
    async function loadNotifications() {

        notificationList.innerHTML = `
            <div class="empty">
                <h2>⏳ Loading Notifications...</h2>
                <p>Please wait.</p>
            </div>
        `;

        errorMessage.style.display = "none";

        try {
            const response = await fetch(API_URL + "/claims", {
                headers: {
                    "bypass-tunnel-reminder": "true"
                }
            });

            if (!response.ok) {
                throw new Error("Unable to retrieve claims.");
            }

            const claims = await response.json();

            if (!Array.isArray(claims)) {
                throw new Error("Invalid data received from server.");
            }

            // Display only claims belonging to the logged-in student.
            const studentClaims = claims.filter(function(claim) {
                return Number(claim.student_id) === STUDENT_ID;
            });

            // Sort newest claims first.
            studentClaims.sort(function(a, b) {
                return new Date(b.claim_date) -
                       new Date(a.claim_date);
            });

            if (studentClaims.length === 0) {
                notificationList.innerHTML = `
                    <div class="empty">
                        <h2>🔔 No Notifications Yet</h2>

                        <p>
                            When you submit a claim for a found item,
                            updates will appear here.
                        </p>
                    </div>
                `;

                return;
            }

            let notificationsHTML = "";

            studentClaims.forEach(function(claim) {
                notificationsHTML += createNotification(claim);
            });

            notificationList.innerHTML = notificationsHTML;

        } catch (error) {
            console.error("Notification error:", error);

            // Offline fallback with demo notification
            notificationList.innerHTML = "";
            const demoItems = [
                { claim_id: "DEMO-1", item_title: "Scientific Calculator (Casio fx-991EX)", claim_status: "PENDING", claim_date: new Date().toISOString(), student_id: STUDENT_ID },
                { claim_id: "DEMO-2", item_title: "College Smart ID Card (CSE Dept)", claim_status: "APPROVED", claim_date: new Date(Date.now() - 86400000).toISOString(), student_id: STUDENT_ID }
            ];
            let html = "";
            demoItems.forEach(function(c) { html += createNotification(c); });
            notificationList.innerHTML = html;

            errorMessage.textContent =
                "⚠️ Server offline. Showing demo notifications. Run Start_CampusFind.bat to load live data.";
            errorMessage.style.display = "block";
            errorMessage.style.background = "#fff8e1";
            errorMessage.style.color = "#b45309";
            errorMessage.style.border = "1px solid #fcd34d";
            errorMessage.style.borderRadius = "8px";
            errorMessage.style.padding = "12px 16px";
            errorMessage.style.marginBottom = "16px";
        }
    }


    // Load notifications when the page opens.
    loadNotifications();

    // Refresh when returning to this page.
    window.addEventListener("focus", loadNotifications);

    // Automatically refresh every 10 seconds.
    setInterval(loadNotifications, 10000);

</script>

</body>
</html>
