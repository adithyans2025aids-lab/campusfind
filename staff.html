<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | CampusFind</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4fa;
            color: #172554;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2563eb;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .security-icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            text-decoration: none;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 8px;
            color: #1e40af;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="security-icon">🛡️</div>

        <h1>CampusFind</h1>

        <p class="subtitle">
            College Staff Portal<br>
            Authorized access only
        </p>

        <form id="staffLoginForm">

            <label for="staffEmail">College Email</label>

            <input
                type="email"
                id="staffEmail"
                placeholder="Enter your official email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">
                Verify & Sign In
            </button>

            <p
                class="message"
                id="message"
                aria-live="polite"
            ></p>

        </form>

        <div class="security-note">
            🔒 Staff credentials are verified by the Java backend.
            Only authorized staff accounts can access the
            administration dashboard.
        </div>

        <a href="index.html" class="back-link">
            ← Back to homepage
        </a>

    </div>

    <script>

        const API = "https://great-suns-kiss.loca.lt/api";

        const form = document.getElementById("staffLoginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("staffEmail")
                .value.trim();

            const password = document.getElementById("password").value;

            message.style.color = "#2563eb";
            message.textContent = "Verifying staff credentials...";

            loginButton.disabled = true;

            try {

                const response = await fetch(
                    API + "/staff/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const responseText = await response.text();

                let result;

                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(
                        "The Java server returned an invalid response. " +
                        "HTTP status: " + response.status +
                        ". Check whether /api/staff/login is registered."
                    );
                }

                if (!response.ok) {
                    throw new Error(
                        result.error || "Staff login failed."
                    );
                }

                if (!result.token || !result.staff) {
                    throw new Error(
                        "Authentication response is incomplete."
                    );
                }

                sessionStorage.setItem(
                    "campusFindStaffToken",
                    result.token
                );

                sessionStorage.setItem(
                    "campusFindStaff",
                    JSON.stringify(result.staff)
                );

                message.style.color = "#15803d";
                message.textContent = "Login successful! Redirecting...";

                window.location.href = "staff-dashboard.html";

            } catch (error) {

                console.error("Staff login error:", error);

                message.style.color = "#dc2626";
                message.textContent = error.message;

            } finally {

                loginButton.disabled = false;

            }

        });

    </script>

</body>
</html>
