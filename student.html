
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | CampusFind</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #172554;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2563eb;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .switch a {
            color: #2563eb;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>CampusFind</h1>
        <p class="subtitle" id="subtitle">Create your student account</p>

        <form id="studentForm">

            <!-- REGISTRATION DETAILS -->

            <div id="registrationFields">

                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>

                <label for="registerNumber">College Register Number</label>
                <input type="text" id="registerNumber"
                       placeholder="Enter register number" required>

                <label for="department">Department</label>
                <select id="department" required>
                    <option value="">Select department</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Artificial Intelligence and Data Science</option>
                    <option>Electronics and Communication</option>
                    <option>Electrical and Electronics</option>
                    <option>Mechanical Engineering</option>
                    <option>Other</option>
                </select>

                <label for="year">Year of Study</label>
                <select id="year" required>
                    <option value="">Select year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>

            </div>

            <!-- EMAIL IS VISIBLE IN BOTH REGISTER AND LOGIN -->

            <label for="email">College Email</label>
            <input type="email" id="email"
                   placeholder="Enter college email" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter password"
                   minlength="8" required>

            <!-- CONFIRM PASSWORD -->

            <div id="confirmField">

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Re-enter password"
                       minlength="8" required>

            </div>

            <button type="submit" id="submitButton">
                Create Account
            </button>

            <p class="message" id="message" aria-live="polite"></p>

        </form>

        <p class="switch">
            Already registered?
            <a id="switchLink">Log in</a>
        </p>

        <a href="index.html" class="back">← Back to homepage</a>

    </div>

    <script>

        const API_URL = "https://great-suns-kiss.loca.lt/api";

        let isRegistering = true;

        const form = document.getElementById("studentForm");
        const registrationFields = document.getElementById("registrationFields");
        const confirmField = document.getElementById("confirmField");
        const subtitle = document.getElementById("subtitle");
        const submitButton = document.getElementById("submitButton");
        const switchLink = document.getElementById("switchLink");
        const message = document.getElementById("message");

        const nameInput = document.getElementById("name");
        const registerNumberInput = document.getElementById("registerNumber");
        const emailInput = document.getElementById("email");
        const departmentInput = document.getElementById("department");
        const yearInput = document.getElementById("year");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");


        // DISPLAY MESSAGE

        function showMessage(text, color) {
            message.style.color = color;
            message.textContent = text;
        }


        // SWITCH BETWEEN REGISTER AND LOGIN

        function updatePage() {

            isRegistering = !isRegistering;

            registrationFields.style.display =
                isRegistering ? "block" : "none";

            confirmField.style.display =
                isRegistering ? "block" : "none";

            nameInput.required = isRegistering;
            registerNumberInput.required = isRegistering;
            departmentInput.required = isRegistering;
            yearInput.required = isRegistering;
            confirmPasswordInput.required = isRegistering;

            emailInput.required = true;
            passwordInput.required = true;

            subtitle.textContent = isRegistering
                ? "Create your student account"
                : "Log in to your student account";

            submitButton.textContent = isRegistering
                ? "Create Account"
                : "Log In";

            switchLink.textContent = isRegistering
                ? "Log in"
                : "Create an account";

            document.querySelector(".switch").firstChild.textContent =
                isRegistering ? "Already registered? " : "New student? ";

            form.reset();

            showMessage("", "");

        }

        switchLink.addEventListener("click", updatePage);


        // STUDENT REGISTRATION

        async function registerStudent() {

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "#dc2626");
                return;
            }

            const studentData = {

                name: nameInput.value.trim(),

                register_number: registerNumberInput.value.trim(),

                email: emailInput.value.trim(),

                department: departmentInput.value,

                study_year: yearInput.value,

                password: password

            };

            submitButton.disabled = true;
            submitButton.textContent = "Creating Account...";

            try {

                const response = await fetch(API_URL + "/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(studentData)

                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Registration failed.");
                }

                showMessage(
                    "Registration successful! Please log in.",
                    "#16a34a"
                );

                form.reset();

                setTimeout(() => {

                    if (isRegistering) {
                        updatePage();
                    }

                }, 1500);

            } catch (error) {

                console.error("Registration error:", error);

                showMessage(
                    error.message || "Unable to connect to server.",
                    "#dc2626"
                );

            } finally {

                submitButton.disabled = false;

                submitButton.textContent = isRegistering
                    ? "Create Account"
                    : "Log In";

            }

        }


        // STUDENT LOGIN

        async function loginStudent() {

            const loginData = {

                email: emailInput.value.trim(),

                password: passwordInput.value

            };

            submitButton.disabled = true;
            submitButton.textContent = "Logging in...";

            try {

                const response = await fetch(API_URL + "/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(loginData)

                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Invalid email or password."
                    );
                }

                // STORE LOGGED-IN STUDENT DETAILS

                const student = result.student || result;

                sessionStorage.setItem(
                    "campusFindStudent",
                    JSON.stringify(student)
                );

                showMessage(
                    "Login successful! Redirecting...",
                    "#16a34a"
                );

                setTimeout(() => {

                    window.location.href = "dashboard.html";

                }, 800);

            } catch (error) {

                console.error("Login error:", error);

                showMessage(
                    error.message || "Unable to connect to server.",
                    "#dc2626"
                );

                submitButton.disabled = false;
                submitButton.textContent = "Log In";

            }

        }


        // FORM SUBMISSION

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            if (isRegistering) {

                registerStudent();

            } else {

                loginStudent();

            }

        });

    </script>

</body>
</html>
